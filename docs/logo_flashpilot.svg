<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="flashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with tech feel -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" stroke="url(#techGradient)" stroke-width="4"/>
  
  <!-- Inner tech ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#techGradient)" stroke-width="2" stroke-dasharray="20,10" opacity="0.6"/>
  
  <!-- Central lightning bolt - main flash element -->
  <path d="M256 80 L180 240 L240 240 L200 380 L332 200 L272 200 L320 80 Z" 
        fill="url(#flashGradient)" 
        filter="url(#glow)"
        stroke="#FF6B35" 
        stroke-width="2"/>
  
  <!-- Pilot/navigation crosshair element -->
  <g stroke="url(#techGradient)" stroke-width="3" fill="none" opacity="0.8">
    <!-- Horizontal line -->
    <line x1="120" y1="256" x2="180" y2="256"/>
    <line x1="332" y1="256" x2="392" y2="256"/>
    <!-- Vertical line -->
    <line x1="256" y1="120" x2="256" y2="180"/>
    <line x1="256" y1="332" x2="256" y2="392"/>
  </g>
  
  <!-- Corner brackets for precision feel -->
  <g stroke="url(#techGradient)" stroke-width="4" fill="none" opacity="0.7">
    <path d="M80 180 L80 80 L180 80"/>
    <path d="M332 80 L392 80 L392 180"/>
    <path d="M80 332 L80 392 L180 392"/>
    <path d="M332 392 L392 392 L392 332"/>
  </g>
  
  <!-- Data flow dots -->
  <g fill="url(#techGradient)" opacity="0.6">
    <circle cx="150" cy="150" r="6"/>
    <circle cx="362" cy="150" r="6"/>
    <circle cx="150" cy="362" r="6"/>
    <circle cx="362" cy="362" r="6"/>
  </g>
  
  <!-- Small circuit lines -->
  <g stroke="url(#techGradient)" stroke-width="1" fill="none" opacity="0.4">
    <path d="M100 200 L130 200 L140 220"/>
    <path d="M372 200 L400 200 L410 180"/>
    <path d="M100 312 L130 312 L140 292"/>
    <path d="M372 312 L400 312 L410 332"/>
  </g>
</svg>
