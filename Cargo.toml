[package]
name = "flashpilot-bridge"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "flashpilot-bridge"
path = "src/main.rs"

[dependencies]
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bincode = "1"
quick-xml = { version = "0.31", features = ["serialize"] }
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
strip = true
lto = true
