name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo check
        run: cargo check --release --locked
      - name: Clippy (warn only)
        run: cargo clippy --release --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release

  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall python/
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build bridge (native test legs need the binary)
        run: cargo build --release --locked
      - name: Test
        run: pytest tests/ -q

  deb:
    name: Build .deb + smoke test
    runs-on: ubuntu-latest
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .deb
        run: bash packaging/build-deb.sh
      - name: Extract .deb for smoke test
        run: |
          DEB=$(ls dist/flashpilot_*.deb | head -1)
          dpkg-deb -x "$DEB" /tmp/flashpilot-pkg
      - name: Smoke test bridge
        run: /tmp/flashpilot-pkg/usr/lib/flashpilot/flashpilot-bridge detect
      - name: Smoke test GUI (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /tmp/flashpilot-pkg/usr/lib/flashpilot/venv/bin/python -c "
          import sys
          sys.path.insert(0, '/tmp/flashpilot-pkg/usr/share/flashpilot')
          from PyQt6.QtWidgets import QApplication
          app = QApplication([])
          from python.gui.qt_app import FrpWindow
          w = FrpWindow()
          print('FrpWindow OK')
          "