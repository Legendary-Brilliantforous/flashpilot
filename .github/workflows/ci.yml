name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo check
        run: cargo check --release --locked
      - name: Clippy (warn only)
        run: cargo clippy --release --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release

  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyQt6 wheels need these at import/offscreen time even with
      # QT_QPA_PLATFORM=offscreen.
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall python/
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build bridge (native test legs need the binary)
        run: cargo build --release --locked
      - name: Test
        run: python -m pytest tests/ -q

  deb:
    name: Build .deb + smoke test
    runs-on: ubuntu-latest
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 \
            dpkg-dev python3-venv rsync
      - name: Build .deb
        run: bash packaging/build-deb.sh
      - name: Extract .deb for smoke test
        run: |
          DEB=$(ls build/dist/flashpilot_*.deb | head -1)
          dpkg-deb -x "$DEB" /tmp/flashpilot-pkg
      # `detect` needs a working libusb context; hosted runners do not expose
      # /dev/bus/usb, so the USB-free registry is the real smoke test and the
      # detector is only checked for a clean (non-panicking) exit.
      - name: Smoke test bridge (USB-free)
        run: /tmp/flashpilot-pkg/usr/lib/flashpilot/flashpilot-bridge flow-list > /dev/null
      - name: Smoke test USB detection (best effort)
        run: |
          /tmp/flashpilot-pkg/usr/lib/flashpilot/flashpilot-bridge detect \
            || echo "no USB access on this runner (expected for a hosted VM)"
      - name: Smoke test GUI (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /tmp/flashpilot-pkg/usr/lib/flashpilot/venv/bin/python -c "
          import sys
          sys.path.insert(0, '/tmp/flashpilot-pkg/usr/share/flashpilot')
          from PyQt6.QtWidgets import QApplication
          app = QApplication([])
          from python.gui.qt_app import FrpWindow
          w = FrpWindow()
          print('FrpWindow OK')
          "
      # The .deb must ship i18n/ next to python/; otherwise the installed app
      # silently falls back to English even though catalogs exist in the repo.
      - name: Smoke test UI translations (installed layout)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /tmp/flashpilot-pkg/usr/lib/flashpilot/venv/bin/python -c "
          import sys
          sys.path.insert(0, '/tmp/flashpilot-pkg/usr/share/flashpilot')
          from PyQt6.QtWidgets import QApplication
          app = QApplication([])
          from python.gui.i18n import available_languages, install, json_path_for
          codes = [row['code'] for row in available_languages()]
          assert 'ar' in codes, codes
          for code in codes:
              path = json_path_for(code)
              assert path.is_file(), (code, path)
          translator = install(app, 'ar')
          assert translator is not None, 'Arabic catalog did not install'
          assert translator.translate('ctx', 'Interface language') != 'Interface language'
          print('i18n OK:', len(codes), 'languages')
          "
