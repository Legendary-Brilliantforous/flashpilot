---
name: ✨ Feature request
about: Suggest a new flow, protocol, device, or UI improvement
title: "[Feature] "
labels: enhancement
assignees: ""
---

**What do you want, and why?**
Describe the feature and the real-world problem it solves. The more specific the better — "support Galaxy S26" beats "support more phones".

**Is this a new flow, a new protocol, or a GUI change?**
- [ ] New flow / method (Python, `frp.py`) — easiest entry point, ~5 lines.
- [ ] New USB protocol / Rust command (`src/`).
- [ ] GUI / theming / UX.
- [ ] Packaging / CI / docs.

**Device / firmware context (if applicable)**
Model, SoC, current mode (ADB / Download / BROM / EDL / BSL), and any firmware you used.

**Reference material**
Links to public protocol write-ups, clean-room sources, or other open-source projects that describe this.

**What would the user flow look like?**
e.g. "Select Samsung → FRP → pick combo → click Run."

**Anything else?**
Design mockups, screenshots, or notes welcome.